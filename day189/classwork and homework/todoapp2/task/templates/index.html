{% extends "master.html" %}

{% block title %}
    main page
{% endblock  %}

{% block body %}
    
    <form method="POST">
        {% csrf_token %}
        <input 
            type="text" 
            name="task_name" 
            placeholder="add new task"
        >
        <input type="submit">
    </form>


    <ul>
        {% for task in tasks %}
            <li>
                <p>{{ task.task_name }}</p>

                <a href="{% url 'delete' task.id %}">
                    <button>Delete</button>
                </a>

            </li>
        {% endfor %}
    </ul>
{% endblock %}
