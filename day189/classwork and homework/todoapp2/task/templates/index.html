<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <input 
            type="text" 
            name="task_name" 
            placeholder="add new task"
        >
        <input type="submit">
    </form>


    <ul>
        {% for task in tasks %}
            <li>
                <p>{{ task.task_name }}</p>

                <a href="{% url 'delete' task.id %}">
                    <button>Delete</button>
                </a>

            </li>
        {% endfor %}
    </ul>
</body>
</html>
