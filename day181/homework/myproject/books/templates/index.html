<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Books</h1>
    <ul>
        {% for book in books %}
            <li>
            <a href="/books/{{ book.id }}/">View Details</a>                <h2>{{ book.title }}</h2>
                <p>Author: {{ book.author }}</p>
                <p>Year: {{ book.year }}</p>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
