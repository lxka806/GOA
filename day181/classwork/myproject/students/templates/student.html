<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% if student %}
        <h1>{{ student.name }}</h1>
        <p>Age: {{ student.age }}</p>
        <p>Grade: {{ student.grade }}</p>
    {% else %}
        <h1>Student not found</h1>
    {% endif %}
</body>
</html>
