<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Admins</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 2rem;
            color: #333;
        }

        .admin-card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .admin-card h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #222;
        }

        .admin-card p {
            color: #666;
            font-size: 0.95rem;
        }

        .admin-card h4 {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <h1>All Admins</h1>

    {% for admin in admins_database %}
        <div class="admin-card">
            <h4>{{ admin.id }}</h4>
            <h2>{{ admin.admin_name }}</h2>
            <p>{{ admin.role }}</p>
        </div>
    {% endfor %}
</body>
</html>
