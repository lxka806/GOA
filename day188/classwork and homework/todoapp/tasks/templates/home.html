<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <input type="text" placeholder="add new task" name="task_name">
        <input type="submit">
    </form>

    <h1>Tasks: </h1>
    <ul>
        {% for task in tasks %}
            <li>
                {{ task.task_name }}
                <a href="{% url 'delete' task.id %}">
                    <button type="button">Delete</button>
                </a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
