<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Products</h1>

    {% for product in products %}
        <a href="/products/{{ product.id }}/">
            <h3>{{ product.title }}</h3>
        </a>
        <p>${{ product.price }}</p>
        <hr>
    {% endfor %}
</body>
</html>
