<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="user_name" placeholder="Enter Username"><br>
        <input type="email" name="user_email" placeholder="Enter email"><br>
        <input type="password" name="user_password" placeholder="Enter password"><br>
        <input type="text" name="user_age" placeholder="Enter age"><br>

        <input type="submit">
    </form>
</body>
</html>
