<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>All Users</h1>
    <ul>
        {% for user in all_users %}
            <li>
                <p>{{ user.username }}</p>
                <p>{{ user.email }}</p>
                <p>{{ user.age }}</p>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
