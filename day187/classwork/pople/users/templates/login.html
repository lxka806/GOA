<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Login</h1>

{% for error in errors %}
<p style="color:red">{{ error }}</p>
{% endfor %}

<form method="POST">
    {% csrf_token %}

    <input 
        type="email" 
        name="email" 
        placeholder="Email"
    >

    <br><br>

    <input 
        type="password" 
        name="password" 
        placeholder="Password"
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>
</body>
</html>
